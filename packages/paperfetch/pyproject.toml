[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfetch"
version = "2.0.0"
description = "一个面向 AI Agent 设计的学术文献信息获取与无损多模态种子论文包生成工具"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-NC-4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio>=4.4.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "pydantic>=2.8.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.46.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff==0.15.12",
]
release = [
    "build>=1.2.2",
]
all = [
    "playwright>=1.46.0",
]

[project.scripts]
paperfetch = "paperfetch.cli:run"
spc = "paperfetch.cli:run"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"paperfetch" = [
    "data/reference/*.json",
    "data/workflow/*.json",
    "data/workflow/datasets/*.json",
    "data/workflow/environments/*.json",
    "data/workflow/fixtures/*.json",
    "data/workflow/manifests/*.json",
    "data/workflow/schemas/*.json",
    "data/config/*.json",
    "data/network/*.json",
    "data/biomedical/policies/*.json",
    "data/biomedical/gold/*.jsonl",
    "data/biomedical/gold/*.soft",
    "data/biomedical/gold/*.txt",
    "downloaders/*.json",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "src/paperfetch/data/reference/raw",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "E702", "F401", "F541", "F841"]
"src/paperfetch/downloaders/base.py" = ["F401"]
"src/paperfetch/sources/s2_pool.py" = ["F401"]
