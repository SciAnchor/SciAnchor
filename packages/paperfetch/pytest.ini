[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = src
asyncio_mode = auto
markers =
    online: requires explicit SPC_RUN_ONLINE_TESTS=1 and real network access
    unit: fast isolated behavior without network, browser, or service processes
    contract: public CLI, schema, event, job, artifact, or Skill contract
    integration: multiple SPC components using isolated local state
    browser: real or simulated browser lifecycle and publisher session behavior
    live: explicit external network or third-party service validation
    release: wheel, installed runtime, server shadow, rollback, or performance gate
