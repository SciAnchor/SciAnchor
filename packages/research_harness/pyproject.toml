[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-harness"
version = "1.5.0"
description = "Agent-first research workflow platform"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
# Workspace siblings are installed from their own directories (setup.sh, CI) and
# are bundled into the single `scianchor` wheel for PyPI (packaging/scianchor),
# so they are deliberately not declared as PyPI dependencies here.
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "anthropic>=0.40.0",
  "openai>=1.0.0",
  "httpx[socks]>=0.27.0",
  "idna>=3.15",
  "defusedxml>=0.7.1",
  # WRITE renders result figures through visualization.experiment_figures,
  # which imports these at module load.
  "matplotlib>=3.8",
  "numpy>=1.22.0",
  "pandas>=2.0",
  "seaborn>=0.13",
  # Workspace sibling packages under packages/{llm_router,paperindex}.
  # setup.sh and CI install them from this monorepo before research_harness.
]

[project.optional-dependencies]
# PDF-runtime dependencies used by research_harness's own PDF code paths
# (acquisition audit, annotations, figure refs, latex compiler, ...). The
# paperindex engine itself lives in packages/paperindex as a core dependency;
# this extra keeps its historical name for install-command compatibility.
paperindex = [
  "pymupdf>=1.24.0",
  "PyPDF2>=3.0.0",
  "pyyaml>=6.0",
  "tiktoken>=0.7.0",
]
docling = [
  "docling>=2.0.0",
]
fal = [
  "fal-client>=0.5.0",
]
deposit = [
  "playwright>=1.40.0",
]
cs = [
  "cso-classifier>=4.0.1",
]
reviewers = [
  "py-openjudge>=0.2.4",
  "numpy>=1.22.0",
  "pypdf>=5.0.0",
  "pymupdf4llm>=0.0.17",
  "openaireview>=0.2.8; python_version >= '3.12'",
]
tables = [
  "pandas>=2.0",
  "jinja2>=3.1",
  "numpy>=1.22.0",
  "scipy>=1.10",
  "great_tables>=0.16",
  "autorank>=1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8",
  "ruff==0.15.12",
]

[project.scripts]
rh = "research_harness.cli:main"
rhub = "research_harness.cli:main"
research-harness = "research_harness.cli:main"
claude-admin = "research_harness.claude_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["research_harness"]

[tool.hatch.build.targets.wheel.force-include]
migrations = "research_harness/migrations"

[tool.pytest.ini_options]
# Parallelism is opt-in (E1, 2026-09-28). Do not put -n in addopts.
#   scripts/full_suite_lock.sh -- pytest -m "not serial" -n 4 --dist loadfile --durations=30
#   pytest -m serial --durations=30
addopts = "--import-mode=importlib"
# Shadow any globally-installed `research_harness` with this worktree's
# source tree. Without this pytest would silently import the
# editable-installed package from the primary checkout, so edits made in
# the worktree would not be tested.
pythonpath = [
  ".",
  "../research_harness_mcp",
  "../llm_router",
  "../paperindex",
]
# Backend-stability test tiers. Select with -m "<tier>"; the harness
# CLI wraps this with a friendlier --tier flag via conftest.
#   smoke      — <3 min each, replay-only, no network  (pre-commit)
#   pre_merge  — <15 min each, record-or-replay        (CI gate)
#   nightly    — minutes to hours, live LLM + full E2E  (nightly run)
#   regression — historical P0/P1 reproductions (runs in every tier)
#   supervised — requires a human-checkpoint stub        (opt-in)
#   autonomous — must finish without intervention        (default target)
markers = [
  "serial: time-sensitive (RH_AGENT_SILENCE_SECONDS, stage_cap_s, time.sleep); not under xdist",
  "smoke: fast structural checks, replay-only, <3min",
  "pre_merge: CI gate tier, <15min, record-or-replay",
  "nightly: long-running full pipeline, live LLM allowed",
  "regression: historical P0/P1 bug reproductions",
  "supervised: exercises the supervised-mode gate pause path",
  "autonomous: exercises the autonomous-mode auto-resolve path",
  "needs_llm: requires real LLM API access (skipped in replay-only)",
  "needs_network: requires network access to arxiv/s2",
]
filterwarnings = [
  "error::DeprecationWarning:research_harness.*",
]
