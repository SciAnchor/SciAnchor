name: Publish to PyPI

# Manual only. Uses PyPI Trusted Publishing: each project on PyPI lists this
# repository, this workflow file and the `pypi` environment as its publisher,
# so no API token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          for dir in packages/llm_router packages/paperindex packages/research_harness \
                     packages/research_harness_mcp packages/paperfetch packaging/sci-anchor; do
            python -m build --sdist --wheel --outdir dist "$dir"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
