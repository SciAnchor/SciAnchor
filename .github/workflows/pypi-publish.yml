name: Publish to PyPI

# Manual only. Uses PyPI Trusted Publishing: each project on PyPI lists this
# repository, this workflow file and the `pypi` environment as its publisher,
# so no API token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          # scianchor bundles packages/ from outside its directory, so it ships
          # as a wheel only; the full source is this public repository.
          python -m build --wheel --outdir dist packaging/scianchor
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # PyPI accepts one pending publisher per (repository, workflow, environment),
    # so every project has its own environment.
    name: Publish ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: scianchor
            environment: pypi
            files: "scianchor-[0-9]*"
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select this project's files
        run: |
          mkdir upload
          shopt -s nullglob
          files=(dist/${{ matrix.files }})
          if [ ${#files[@]} -eq 0 ]; then echo "no files for ${{ matrix.project }}"; ls dist; exit 1; fi
          mv "${files[@]}" upload/
          ls -l upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
