name: Publish to PyPI

# Manual only. Uses PyPI Trusted Publishing: each project on PyPI lists this
# repository, this workflow file and the `pypi` environment as its publisher,
# so no API token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          for dir in packages/llm_router packages/paperindex packages/research_harness \
                     packages/research_harness_mcp packages/paperfetch packaging/sci-anchor; do
            python -m build --sdist --wheel --outdir dist "$dir"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # PyPI accepts one pending publisher per (repository, workflow, environment),
    # so every project has its own environment.
    name: Publish ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: scianchor
            environment: pypi
            files: "scianchor-[0-9]*"
          - project: scianchor-mcp
            environment: pypi-scianchor-mcp
            files: "scianchor_mcp-*"
          - project: scianchor-llm-router
            environment: pypi-scianchor-llm-router
            files: "scianchor_llm_router-*"
          - project: scianchor-paperindex
            environment: pypi-scianchor-paperindex
            files: "scianchor_paperindex-*"
          - project: scianchor-paperfetch
            environment: pypi-scianchor-paperfetch
            files: "scianchor_paperfetch-*"
          - project: sci-anchor
            environment: pypi-sci-anchor
            files: "sci_anchor-*"
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select this project's files
        run: |
          mkdir upload
          shopt -s nullglob
          files=(dist/${{ matrix.files }})
          if [ ${#files[@]} -eq 0 ]; then echo "no files for ${{ matrix.project }}"; ls dist; exit 1; fi
          mv "${files[@]}" upload/
          ls -l upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
