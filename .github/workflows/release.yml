name: Publish releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish missing GitHub releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify requested tag checkout
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Refusing to publish non-version tag: $tag" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag does not exist in this checkout: $tag" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/$tag^{}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "HEAD $head_commit does not match $tag commit $tag_commit" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e "packages/llm_router[all]"
          pip install -e "packages/paperindex"
          pip install -e "packages/research_harness[dev,paperindex]"
          pip install -e "packages/research_harness_mcp[dev]"
          python -m pip install pip-audit

      - name: Quick release guards
        run: scripts/codex-check.sh --quick

      - name: Full release guards
        run: scripts/codex-check.sh --full

      - name: Coverage release guards
        run: scripts/codex-check.sh --coverage

      - name: Required dependency audit
        run: bash scripts/dependency-audit-report.sh --require-report --fail-on-findings

      - name: Release artifact smoke
        run: scripts/release-artifact-smoke.sh

      - name: Publish requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          title="Research Harness $tag"

          echo "Creating release $tag"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --generate-notes
