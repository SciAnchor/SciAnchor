[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sci-anchor"
version = "1.5.0"
description = "Alias for scianchor: installs SciAnchor's Research Harness engine"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["scianchor"]

[project.urls]
Homepage = "https://github.com/scianchor/scianchor"

[tool.hatch.build.targets.wheel]
bypass-selection = true
