[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The single PyPI distribution of the Research Harness engine. It bundles the
# workspace packages llm_router, paperindex, research_harness and
# research_harness_mcp; packages/research_harness/tests/test_scianchor_bundle.py
# keeps these dependencies a superset of theirs.

[project]
name = "scianchor"
version = "1.5.0"
description = "SciAnchor: evidence-grounded, traceable AI research. Bundles Research Harness, the open-source research engine."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "anthropic>=0.40.0",
  "openai>=1.0.0",
  "httpx[socks]>=0.27.0",
  "idna>=3.15",
  "defusedxml>=0.7.1",
  "matplotlib>=3.8",
  "numpy>=1.22.0",
  "pandas>=2.0",
  "seaborn>=0.13",
  "litellm>=1.89.0",
  "aiohttp>=3.14.0",
  "pymupdf>=1.24.0",
  "mcp>=1.0,<2",
  "PyJWT>=2.13.0",
  "starlette>=1.0.1",
]

[project.optional-dependencies]
paperindex = ["pymupdf>=1.24.0", "PyPDF2>=3.0.0", "pyyaml>=6.0", "tiktoken>=0.7.0"]
docling = ["docling>=2.0.0"]
fal = ["fal-client>=0.5.0"]
deposit = ["playwright>=1.40.0"]
cs = ["cso-classifier>=4.0.1"]
reviewers = ["py-openjudge>=0.2.4", "numpy>=1.22.0", "pypdf>=5.0.0", "pymupdf4llm>=0.0.17", "openaireview>=0.2.8; python_version >= '3.12'"]
tables = ["pandas>=2.0", "jinja2>=3.1", "numpy>=1.22.0", "scipy>=1.10", "great_tables>=0.16", "autorank>=1.3"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
rh = "research_harness.cli:main"
rhub = "research_harness.cli:main"
research-harness = "research_harness.cli:main"
claude-admin = "research_harness.claude_admin:main"
paperindex = "paperindex.cli:main"
rh-mcp = "research_harness_mcp.server:run"
research-harness-mcp = "research_harness_mcp.server:run"
rh-gateway = "research_harness_mcp.gateway:run"
rh-mcp-search = "research_harness_mcp.search_stdio:run"

[project.urls]
Homepage = "https://github.com/scianchor/scianchor"
Source = "https://github.com/scianchor/scianchor"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../packages/llm_router/llm_router" = "llm_router"
"../../packages/paperindex/paperindex" = "paperindex"
"../../packages/research_harness/research_harness" = "research_harness"
"../../packages/research_harness/migrations" = "research_harness/migrations"
"../../packages/research_harness_mcp/research_harness_mcp" = "research_harness_mcp"
